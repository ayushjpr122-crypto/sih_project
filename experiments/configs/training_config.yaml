seed: 42
dataset:
  start: 2018-01-01
  end: 2025-12-31
  horizons: [7, 14, 30]
split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  method: chronological
features:
  context_len: 30
  patch_len: 6
  stride: 3
models:
  ridge:
    alpha: 1.0
  mlp:
    hidden: [128, 64]
    lr: 0.001
    epochs: 12
  huggingface_patchtst:
    d_model: 64
    n_heads: 4
    n_layers: 2
    dropout: 0.1
    lr: 0.001
    epochs: 8
    batch_size: 1024
    early_stopping_patience: 5
evaluation:
  metrics: [MAE, RMSE, MAPE, sMAPE, R2, DirectionalAccuracy]
  horizons: [7, 14, 30]
